<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Radar - OSINT & Map</title>
    <style>
        :root { 
            --bg: #0b0f19; --card: #131a2b; --border: #2a3b5c; 
            --accent: #00ffcc; --text: #fff; --muted: #8fa3c7;
            --red: #ff5252; --orange: #ff9800; --yellow: #ffcc00;
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--accent); font-size: 24px; margin-bottom: 10px; text-align: center;}
        
        .status-panel {
            background: #1f2d44;
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-info { font-size: 13px; line-height: 1.5; }
        
        .card { 
            background: var(--card); 
            border: 1px solid var(--accent); 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-map {
            max-width: 1200px; 
            border-color: #b388ff;
        }
        
        .controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
            flex-wrap: wrap; 
            margin-bottom: 15px; 
        }
        input[type="number"], input[type="text"] { 
            padding: 9px; 
            background: #131a2b; 
            color: var(--text); 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            box-sizing: border-box;
            text-align: center;
        }
        input[type="number"] { width: 110px; }
        input[type="text"] { flex: 1; min-width: 250px; max-width: 400px; }
        
        button { 
            padding: 9px 20px; 
            border: none; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.2s; 
            background: var(--accent); 
            color: var(--bg);
        }
        button:hover { opacity: 0.8; }
        
        .results { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 10px; 
            text-align: left; 
        }
        .result-item { 
            background: #1f2d44; 
            padding: 10px; 
            border-radius: 6px; 
            border-left: 4px solid var(--border); 
        }

        .map-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .map-container { 
            position: relative; 
            background: #000; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            width: 100%; 
            max-width: 800px; 
            aspect-ratio: 1/1; 
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .map-container canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
            cursor: grab; 
        }
        .map-container canvas:active {
            cursor: grabbing;
        }

        .map-tooltip {
            position: absolute;
            display: none;
            background: rgba(19, 26, 43, 0.95);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            pointer-events: none; 
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            white-space: nowrap;
            text-align: left;
        }

        .map-legend { 
            margin-top: 20px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            width: 100%;
        }
        .legend-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #1f2d44; 
            padding: 8px 15px; 
            border-radius: 6px; 
            min-width: 200px; 
        }
        .legend-color { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 8px; 
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h1>🛰️ Внешний радар OSINT</h1>
    
    <div class="status-panel" id="serverStatusPanel">
        <div class="status-info">
            <span style="color: var(--muted);">Подключение к серверу...</span>
        </div>
        <button style="padding: 5px 10px; font-size: 12px; background: transparent; border: 1px solid var(--muted); color: var(--muted);" onclick="checkServerStatus()">🔄 Обновить статус</button>
    </div>
    
    <div class="card">
        <h3 style="color: var(--accent); margin-top: 0; font-size: 20px;">🎯 Глобальный поиск</h3>
        <p style="color: var(--muted); font-size: 13px; margin-bottom: 20px;">Поиск баз в заданном радиусе (до 100 объектов).</p>
        
        <div class="controls">
            <input type="number" id="targetX" placeholder="Ось X">
            <span style="color: var(--muted); font-weight: bold;">:</span>
            <input type="number" id="targetY" placeholder="Ось Y">
            <input type="number" id="minDist" placeholder="Слепая зона" title="Не показывать объекты ближе этой дистанции">
            <input type="number" id="maxDist" placeholder="Радиус (макс)" title="Искать не дальше этой дистанции (оставь пустым для всей галактики)">
        </div>
        <div class="controls">
            <input type="text" id="ignorePlayers" placeholder="Игнорировать игроков (имена через запятую)">
            <button onclick="searchTargets()">Сканировать сектор</button>
        </div>
        
        <div style="margin-bottom: 15px; font-size: 14px; color: var(--accent); font-weight: bold;" id="statsLabel"></div>
        <div id="targetResults" class="results"></div>
    </div>

    <div class="card card-map">
        <h3 style="color: #b388ff; margin-top: 0; font-size: 20px;">🗺️ Тактическая Карта Галактики</h3>
        <p style="font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px;">
            • Масштабируйте карту <b>колесиком мыши</b>, перемещайтесь <b>зажав кнопку</b>.<br>
            • Ячейки сетки закрашиваются в цвета игроков. При наведении видна информация.
        </p>

        <div class="controls" style="margin-bottom: 25px;">
            <input type="text" id="mapPlayerInput" placeholder="Введите точное имя игрока">
            <button style="background: #b388ff;" onclick="addPlayerToMap()">+ Вывести на карту</button>
        </div>

        <div class="map-wrapper">
            <div class="map-container">
                <canvas id="galaxyMap" width="800" height="800"></canvas>
                <div id="mapTooltip" class="map-tooltip"></div>
            </div>
            
            <div class="map-legend" id="mapLegend"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://sde.domedome.crazedns.ru'; 

        async function checkServerStatus() {
            const panel = document.querySelector('#serverStatusPanel .status-info');
            panel.innerHTML = '<span style="color: var(--muted);">Обновление данных...</span>';
            try {
                const res = await fetch(`${API_BASE_URL}/api/status`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                let radarStatus = data.isScannerRunning ? `<strong style="color: var(--accent);">🔄 Сканирование (${data.scannerProgress} / ${data.scannerTotal})</strong>` :
                                  (!data.scannerEnabled ? `<span style="color: var(--muted);">Выключен</span>` :
                                  (data.lastScannerError ? `<strong style="color: var(--red);">Ошибка сканирования</strong>` :
                                  `<strong style="color: var(--yellow);">Спит (по расписанию)</strong>`));

                panel.innerHTML = `
                    <div style="margin-bottom: 4px;">
                        <span style="color: var(--muted);">Свежая запись в БД:</span> 
                        <strong style="color: #fff;">${data.lastEventTime}</strong>
                    </div>
                    <div><span style="color: var(--muted);">Состояние парсера:</span> ${radarStatus}</div>
                `;
            } catch (e) { panel.innerHTML = '<strong style="color: var(--red);">❌ API недоступен</strong>'; }
        }

        async function searchTargets() {
            const x = document.getElementById('targetX').value;
            const y = document.getElementById('targetY').value;
            const md = document.getElementById('minDist').value || 0;
            const maxD = document.getElementById('maxDist').value || 0;
            const ignPlayers = document.getElementById('ignorePlayers').value;
            
            const resDiv = document.getElementById('targetResults');
            const statsLabel = document.getElementById('statsLabel');

            if (x === '' || y === '') { resDiv.innerHTML = '<span style="color:var(--red);">Введите координаты X и Y</span>'; statsLabel.innerText = ''; return; }
            resDiv.innerHTML = '<span style="color:var(--yellow);">Запрос к базе данных...</span>';
            statsLabel.innerText = '';

            try {
                const res = await fetch(`${API_BASE_URL}/api/global-nearest?x=${x}&y=${y}&minDist=${md}&maxDist=${maxD}&ignorePlayers=${encodeURIComponent(ignPlayers)}`);
                if (!res.ok) throw new Error();
                const data = await res.json();

                if (data.length === 0) { resDiv.innerHTML = '<span style="color:var(--muted);">В заданном радиусе никого не найдено.</span>'; return; }

                statsLabel.innerText = `Найдено объектов: ${data.length}`;
                let html = '';
                data.forEach((t) => {
                    let bColor = 'var(--muted)';
                    if (t.Distance <= 200) bColor = 'var(--red)';
                    else if (t.Distance <= 500) bColor = 'var(--orange)';
                    else if (t.Distance <= 1000) bColor = 'var(--yellow)';
                    else if (t.Distance <= 2000) bColor = 'var(--accent)';

                    let fStyle = t.IsMoving ? 'font-style: italic;' : '';
                    html += `
                    <div class="result-item" style="border-left-color: ${bColor}; ${fStyle}">
                        <div style="color:${bColor}; font-weight:bold; margin-bottom:5px;">Дистанция: ${t.Distance}</div>
                        <div style="font-size:15px; color:#fff; font-weight:bold;">${t.PlayerName}</div>
                        <div style="font-size:13px; color:var(--muted);">Координаты: <span style="color:#fff;">${t.X}:${t.Y}</span></div>
                        <div style="font-size:12px; color:var(--muted); margin-top: 4px;">Система: ${t.SystemName || 'Без названия'}</div>
                        ${t.IsMoving ? '<div style="font-size: 11px; color: var(--orange); margin-top: 4px;">⚠️ В движении</div>' : ''}
                    </div>`;
                });
                resDiv.innerHTML = html;
            } catch (e) { resDiv.innerHTML = '<span style="color:var(--red);">Ошибка соединения с сервером.</span>'; }
        }

        // --- ИНТЕРАКТИВНАЯ СЕТОЧНАЯ КАРТА ---
        const mapColors = ['#00ffcc', '#ff5252', '#ff9800', '#b388ff', '#ffcc00'];
        let activeMapPlayers = [];
        
        const canvas = document.getElementById('galaxyMap');
        const ctx = canvas.getContext('2d');
        const mapTooltip = document.getElementById('mapTooltip');

        // Настройки камеры
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startDragMouse = { x: 0, y: 0 };
        let startDragOffset = { x: 0, y: 0 };

        // Перевод игровых координат в пиксели холста (800x800)
        // Галактика по X: от -320000 до 320000 (ширина 640000)
        // Галактика по Y: от -160000 до 480000 (высота 640000)
        const getScreenCoords = (x, y) => ({
            x: ((x + 320000) / 640000) * 800,
            y: ((480000 - y) / 640000) * 800
        });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startDragMouse = { x: e.clientX, y: e.clientY };
            startDragOffset = { x: offsetX, y: offsetY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = startDragOffset.x + (e.clientX - startDragMouse.x);
                offsetY = startDragOffset.y + (e.clientY - startDragMouse.y);
                drawMap();
                mapTooltip.style.display = 'none';
                return;
            }

            // Проверка наведения мыши (Hover / Tooltip)
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Переводим экранные координаты мыши в мировые игровые координаты
            const worldMouseX = (mouseX - offsetX) / scale;
            const worldMouseY = (mouseY - offsetY) / scale;

            let hoveredCell = null;
            activeMapPlayers.forEach(p => {
                p.tracks.forEach(t => {
                    let sc = getScreenCoords(t.X, t.Y);
                    // Проверяем попадание в радиус ячейки
                    if (Math.hypot(worldMouseX - sc.x, worldMouseY - sc.y) < 15) {
                        hoveredCell = { x: t.X, y: t.Y, sys: t.SystemName, player: p.name, isMoving: t.IsMoving };
                    }
                });
            });

            if (hoveredCell) {
                let statusText = hoveredCell.isMoving ? '<span style="color:var(--orange);">⚠️ В движении (Флот)</span>' : '<span style="color:#fff;">Статично (База)</span>';
                let sysInfo = hoveredCell.sys ? ` (${hoveredCell.sys})` : '';
                mapTooltip.innerHTML = `
                    <div style="color: var(--accent); font-weight: bold; margin-bottom: 5px;">📍 ${hoveredCell.x} : ${hoveredCell.y}${sysInfo}</div>
                    <div>Игрок: <b style="color: #fff;">${hoveredCell.player}</b></div>
                    <div style="font-size: 12px; color: #8fa3c7; margin-top: 3px;">Статус: ${statusText}</div>
                `;
                mapTooltip.style.left = (e.clientX - rect.left + 15) + 'px';
                mapTooltip.style.top = (e.clientY - rect.top + 15) + 'px';
                mapTooltip.style.display = 'block';
                canvas.style.cursor = 'pointer';
            } else {
                mapTooltip.style.display = 'none';
                canvas.style.cursor = 'grab';
            }
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; mapTooltip.style.display = 'none'; canvas.style.cursor = 'default'; });

        // Плавный зум в центр холста
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.15;
            let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            
            if (newScale < 0.2) newScale = 0.2;
            if (newScale > 100) newScale = 100;

            const rect = canvas.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            offsetX = centerX - (centerX - offsetX) * (newScale / scale);
            offsetY = centerY - (centerY - offsetY) * (newScale / scale);
            scale = newScale;

            mapTooltip.style.display = 'none';
            drawMap();
        }, { passive: false });

        async function addPlayerToMap() {
            const input = document.getElementById('mapPlayerInput');
            const pName = input.value.trim();
            if(!pName) return;
            if(activeMapPlayers.length >= 5) { alert('Максимум 5 игроков на карте!'); return; }
            if(activeMapPlayers.find(p => p.name.toLowerCase() === pName.toLowerCase())) { alert('Игрок уже добавлен.'); return; }

            const btn = input.nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = 'Загрузка...';

            try {
                const res = await fetch(`${API_BASE_URL}/api/player-tracks?player=${encodeURIComponent(pName)}`);
                if(!res.ok) throw new Error();
                const data = await res.json();
                
                if(data.length === 0) { alert(`Объекты игрока "${pName}" не найдены в базе данных.`); btn.innerText = originalText; return; }

                const color = mapColors[activeMapPlayers.length];
                activeMapPlayers.push({ name: data[0].PlayerName || pName, color: color, tracks: data });
                
                input.value = '';
                updateMapLegend();
                drawMap();
            } catch(e) { 
                alert('Ошибка соединения при загрузке данных для карты.'); 
            } finally {
                btn.innerText = originalText;
            }
        }

        function removePlayerFromMap(index) {
            activeMapPlayers.splice(index, 1);
            updateMapLegend();
            drawMap();
        }

        function updateMapLegend() {
            const container = document.getElementById('mapLegend');
            container.innerHTML = '';
            activeMapPlayers.forEach((p, i) => {
                container.innerHTML += `
                    <div class="legend-item" style="border-left: 3px solid ${p.color}">
                        <div>
                            <span class="legend-color" style="background: ${p.color};"></span>
                            <b style="color:#fff; font-size:14px;">${p.name}</b> 
                            <span style="color:var(--muted); font-size:12px; margin-left:5px;">(${p.tracks.length} шт.)</span>
                        </div>
                        <button style="padding: 2px 8px; background: transparent; border: 1px solid var(--red); color: var(--red); cursor: pointer;" onclick="removePlayerFromMap(${i})">✖</button>
                    </div>
                `;
            });
        }

        function drawMap() {
            if(!canvas) return;
            
            const cw = canvas.width;  // 800
            const ch = canvas.height; // 800

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, cw, ch);
            ctx.restore();

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // 1. Рисуем ВИДИМУЮ координатную сетку галактики
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1 / scale;
            ctx.fillStyle = '#475569';
            ctx.font = `${10 / scale}px Arial`;

            let step = 40000; // Шаг сетки по координатам
            for (let x = -320000; x <= 320000; x += step) {
                let p1 = getScreenCoords(x, -160000);
                let p2 = getScreenCoords(x, 480000);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                if (x !== 0) ctx.fillText(`X:${x}`, p1.x + 3, p1.y - 5);
            }
            for (let y = -160000; y <= 480000; y += step) {
                let p1 = getScreenCoords(-320000, y);
                let p2 = getScreenCoords(320000, y);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                if (y !== 0) ctx.fillText(`Y:${y}`, p1.x + 3, p1.y - 5);
            }

            // Главные оси X=0 и Y=0 (Солнце)
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2 / scale;
            let axisY1 = getScreenCoords(0, -160000), axisY2 = getScreenCoords(0, 480000);
            ctx.beginPath(); ctx.moveTo(axisY1.x, axisY1.y); ctx.lineTo(axisY2.x, axisY2.y); ctx.stroke();

            let axisX1 = getScreenCoords(-320000, 0), axisX2 = getScreenCoords(320000, 0);
            ctx.beginPath(); ctx.moveTo(axisX1.x, axisX1.y); ctx.lineTo(axisX2.x, axisX2.y); ctx.stroke();

            // Опознавательные точки: Солнце и Черная дыра
            let sun = getScreenCoords(0, 0);
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath(); ctx.arc(sun.x, sun.y, 8 / scale, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffcc00'; ctx.font = `bold ${12 / scale}px Arial`;
            ctx.fillText('☀️ Sun (0:0)', sun.x + 12, sun.y + 4);

            let bh = getScreenCoords(0, 160000);
            ctx.fillStyle = '#b388ff';
            ctx.beginPath(); ctx.arc(bh.x, bh.y, 7 / scale, 0, Math.PI*2); ctx.fill();
            ctx.fillText('🕳️ Blackhole (0:160k)', bh.x + 12, bh.y + 4);

            // 2. Собираем данные игроков в общую карту ячеек
            let coordMap = new Map();
            activeMapPlayers.forEach(p => {
                p.tracks.forEach(t => {
                    let key = `${t.X}:${t.Y}`;
                    if (!coordMap.has(key)) {
                        coordMap.set(key, { x: t.X, y: t.Y, items: [] });
                    }
                    coordMap.get(key).items.push({ player: p.name, color: p.color, isMoving: t.IsMoving });
                });
            });

            // 3. Рендерим закрашенные ячейки (Мозаику)
            // Размер ячейки в пикселях холста (фиксированный размер плитки, который идеально прилегает к другим)
            let tileSize = 20; 

            coordMap.forEach((cell) => {
                let sc = getScreenCoords(cell.x, cell.y);
                let half = tileSize / 2;
                let count = cell.items.length;

                if (count === 1) {
                    let item = cell.items[0];
                    ctx.fillStyle = item.color;
                    ctx.fillRect(sc.x - half, sc.y - half, tileSize, tileSize);

                    // Четкие границы ячейки
                    ctx.strokeStyle = '#0b0f19';
                    ctx.lineWidth = 1.5 / scale;
                    ctx.strokeRect(sc.x - half, sc.y - half, tileSize, tileSize);

                    // Если флот в движении — рисуем метку внутри
                    if (item.isMoving) {
                        ctx.fillStyle = '#0b0f19';
                        ctx.fillRect(sc.x - half/2, sc.y - half/2, tileSize/2, tileSize/2);
                    }
                } else {
                    // Если несколько игроков в одной системе — делим ячейку на половины
                    let subSizes = [
                        { x: sc.x - half, y: sc.y - half, w: half, h: tileSize }, // Левая половина
                        { x: sc.x,        y: sc.y - half, w: half, h: tileSize }  // Правая половина
                    ];

                    cell.items.forEach((item, idx) => {
                        let sub = subSizes[idx % 2];
                        ctx.fillStyle = item.color;
                        ctx.fillRect(sub.x, sub.y, sub.w, sub.h);
                    });

                    ctx.strokeStyle = '#0b0f19';
                    ctx.lineWidth = 2 / scale;
                    ctx.strokeRect(sc.x - half, sc.y - half, tileSize, tileSize);
                }
            });

            ctx.restore();
        }

        window.onload = () => {
            checkServerStatus();
            drawMap(); 
        };
    </script>
</body>
</html>
